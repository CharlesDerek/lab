[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"

[features]
default = ["kafka"]
kafka = ["dep:rdkafka"]

[[bin]]
name = "orchestrator"
path = "src/main.rs"
required-features = ["kafka"]

[dependencies]
rdkafka = { version = "0.39.0", features = ["cmake-build", "curl-static"], optional = true }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
