[package]
name = "athernex-siem"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "A bounded Rust SIEM research lab with compact events and an interactive investigation console"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
