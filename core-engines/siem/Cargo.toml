[package]
name = "athernex-siem"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "A bounded Rust SIEM research lab with compact events and an interactive investigation console"

[dependencies]
orchestrator = { path = "../orchestrator", default-features = false }
athernex-endpoint-protocol = { path = "../endpoint-protocol" }
zip = { version = "9", default-features = false, features = ["deflate"] }
fs2 = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "io-util", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
getrandom = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
athernex-endpoint = { path = "../endpoint" }
rcgen = "0.13"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
