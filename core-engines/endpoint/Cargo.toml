[package]
name = "athernex-endpoint"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
athernex-endpoint-protocol = { path = "../endpoint-protocol" }
athernex-endpoint-native = { path = "../endpoint-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
getrandom = "0.4"
sha2 = "0.10"
tempfile = "3"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_System_Kernel", "Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Services", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = "0.6"

[dev-dependencies]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_RemoteDesktop", "Win32_System_ProcessStatus"] }

[target.'cfg(unix)'.dev-dependencies]
orchestrator = { path = "../orchestrator", default-features = false }
athernex-siem = { path = "../siem" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
