name: Endpoint builds and platform tests
on:
  pull_request:
    paths:
      - 'core-engines/endpoint/**'
      - 'core-engines/endpoint-protocol/**'
      - 'core-engines/endpoint-native/**'
      - 'core-engines/macos-network/**'
      - 'core-engines/siem/**'
      - 'infrastructure/endpoint/**'
      - 'tools/package_endpoint.py'
      - 'tools/test_package_endpoint.py'
      - 'tools/package_windows_filter.py'
      - 'tools/test_package_windows_filter.py'
      - 'tools/package_macos_network.py'
      - 'tools/test_package_macos_network.py'
      - 'tools/build_macos_network.py'
      - 'tools/test_build_macos_network.py'
      - 'tools/package_engine.py'
      - 'tools/test_package_engine.py'
      - 'tools/verify_engine_update.py'
      - 'tools/engine_rollout.py'
      - 'tools/verify_process_events.py'
      - 'tools/verify_auth_events.py'
      - 'tools/test_auth_event_fixture.py'
      - 'tools/verify_network_events.py'
      - 'tools/verify_network_fleet.py'
      - 'tools/network_fleet_tls.py'
      - 'tools/test_engine_fixture_resources.py'
      - 'tools/verify_engine_ui.cjs'
      - 'tools/test_macos_installer.py'
      - 'tools/verify_endpoint_fleet.py'
      - 'tools/verify_endpoint_update.py'
      - 'tools/native_fixture.py'
      - 'tools/verify_automatic_update.py'
      - 'tools/verify_controller_maintenance.py'
      - 'tools/verify_controller_delivery.py'
      - 'tools/test_controller_delivery.py'
      - 'tools/verify_endpoint_rollout.py'
      - 'tools/verify_native_protection.py'
      - 'tools/verify_native_adapter.py'
      - 'tools/native_read_barrier.py'
      - 'tools/test_native_read_barrier.py'
      - 'tools/verify_macos_native.py'
      - 'tools/test_macos_native_verifier.py'
      - 'tools/verify_native_service.py'
      - 'tools/prepare_native_protection_fixture.py'
      - 'tools/prepare_windows_filter_kits.py'
      - 'tools/build_windows_filter.py'
      - 'tools/verify_windows_filter_transport.py'
      - 'tools/verify_windows_native_samples.py'
      - 'tools/test_windows_scratch_formatter.py'
      - 'tools/test_windows_installer.py'
      - 'tools/verify_windows_service.ps1'
      - 'tools/verify_windows_service_ci.ps1'
      - 'tools/test_windows_service_ci.py'
      - 'tools/verify_windows_isolation_ci.ps1'
      - 'tools/test_windows_isolation_ci.py'
      - 'tools/verify_windows_process_events_ci.ps1'
      - 'tools/test_windows_process_events_ci.py'
      - 'tools/verify_windows_workspace_ci.ps1'
      - 'tools/test_windows_workspace_ci.py'
      - 'tools/verify_windows_authentication_agent_ci.ps1'
      - 'tools/test_windows_authentication_agent_ci.py'
      - 'tools/verify_windows_network_events_ci.ps1'
      - 'tools/test_windows_network_events_ci.py'
      - 'tools/verify_windows_network_source_ci.ps1'
      - 'tools/test_windows_network_source_ci.py'
      - 'tools/test_verification_guards.py'
      - 'tools/verify_ecosystem_recovery.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/endpoint.yml'
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['codex/endpoint-native-validation']
permissions:
  contents: read
jobs:
  windows-network-events:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify network-events evidence and privileged task failure handling
        run: |
          python tools/test_windows_service_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Task runner control-flow tests failed' }
          python tools/test_windows_network_events_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Network-events evidence tests failed' }
      - name: Build and select exact release agent and native network test executable
        shell: pwsh
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          cargo build --locked --release -p athernex-endpoint --bin athernex-endpoint
          if ($LASTEXITCODE -ne 0) { throw 'Release network-events agent build failed' }
          cargo test --locked -p athernex-endpoint --lib --no-run --message-format=json > "$env:RUNNER_TEMP/network-events-build.jsonl"
          if ($LASTEXITCODE -ne 0) { throw 'Native network-events agent proof build failed' }
          $records = Get-Content -LiteralPath "$env:RUNNER_TEMP/network-events-build.jsonl" | ForEach-Object { $_ | ConvertFrom-Json }
          $matches = @($records | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -ceq 'athernex_endpoint' -and $_.profile.test -eq $true -and $_.executable })
          if ($matches.Count -ne 1) { throw 'Expected one endpoint library test executable' }
          ('NETWORK_EVENTS_ENDPOINT_TESTS=' + $matches[0].executable) >> $env:GITHUB_ENV
      - name: Prove the actual release-agent ETW network component and agent loop as LocalSystem
        timeout-minutes: 15
        shell: pwsh
        run: tools/verify_windows_network_events_ci.ps1 -AgentExecutable "target/release/athernex-endpoint.exe" -EndpointTests "$env:NETWORK_EVENTS_ENDPOINT_TESTS" -OutputDirectory "$env:RUNNER_TEMP/native-windows-network-events" -DisposableHost
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-network-events
          # Component and agent acceptance only. Raw records, tuples, logs and worker reports stay private.
          path: |
            ${{ runner.temp }}/native-windows-network-events/inputs.json
            ${{ runner.temp }}/native-windows-network-events/network-events-validation.json
          if-no-files-found: warn
  windows-authentication-agent:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authentication-agent evidence and privileged task failure handling
        run: |
          python tools/test_windows_service_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Task runner control-flow tests failed' }
          python tools/test_windows_authentication_agent_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Authentication-agent evidence tests failed' }
      - name: Build and select exact release agent and native authentication test executable
        shell: pwsh
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          cargo build --locked --release -p athernex-endpoint --bin athernex-endpoint
          if ($LASTEXITCODE -ne 0) { throw 'Release authentication agent build failed' }
          cargo test --locked -p athernex-endpoint --lib --no-run --message-format=json > "$env:RUNNER_TEMP/authentication-agent-build.jsonl"
          if ($LASTEXITCODE -ne 0) { throw 'Native authentication agent proof build failed' }
          $records = Get-Content -LiteralPath "$env:RUNNER_TEMP/authentication-agent-build.jsonl" | ForEach-Object { $_ | ConvertFrom-Json }
          $matches = @($records | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -ceq 'athernex_endpoint' -and $_.profile.test -eq $true -and $_.executable })
          if ($matches.Count -ne 1) { throw 'Expected one endpoint library test executable' }
          ('AUTHENTICATION_AGENT_ENDPOINT_TESTS=' + $matches[0].executable) >> $env:GITHUB_ENV
      - name: Prove the actual release-agent Security authentication loop as LocalSystem
        timeout-minutes: 15
        shell: pwsh
        run: tools/verify_windows_authentication_agent_ci.ps1 -AgentExecutable "target/release/athernex-endpoint.exe" -EndpointTests "$env:AUTHENTICATION_AGENT_ENDPOINT_TESTS" -OutputDirectory "$env:RUNNER_TEMP/native-windows-authentication-agent" -DisposableHost
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-authentication-agent
          # Actual agent acceptance only. Accounts, XML, raw logs and worker reports stay private.
          path: |
            ${{ runner.temp }}/native-windows-authentication-agent/inputs.json
            ${{ runner.temp }}/native-windows-authentication-agent/authentication-agent-validation.json
          if-no-files-found: warn
  windows-network-source:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify network-source evidence and privileged task failure handling
        run: |
          python tools/test_windows_service_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Task runner control-flow tests failed' }
          python tools/test_windows_network_source_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Network-source evidence tests failed' }
      - name: Build and select exact native network source proof executable
        shell: pwsh
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          cargo test --locked -p athernex-endpoint --lib --no-run --message-format=json > "$env:RUNNER_TEMP/network-source-build.jsonl"
          if ($LASTEXITCODE -ne 0) { throw 'Native network source proof build failed' }
          $records = Get-Content -LiteralPath "$env:RUNNER_TEMP/network-source-build.jsonl" | ForEach-Object { $_ | ConvertFrom-Json }
          $matches = @($records | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -ceq 'athernex_endpoint' -and $_.profile.test -eq $true -and $_.executable })
          if ($matches.Count -ne 1) { throw 'Expected one endpoint library test executable' }
          ('NETWORK_SOURCE_ENDPOINT_TESTS=' + $matches[0].executable) >> $env:GITHUB_ENV
      - name: Prove only the native ETW network source as LocalSystem
        timeout-minutes: 15
        shell: pwsh
        run: tools/verify_windows_network_source_ci.ps1 -EndpointTests "$env:NETWORK_SOURCE_ENDPOINT_TESTS" -OutputDirectory "$env:RUNNER_TEMP/native-windows-network-source" -DisposableHost
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-network-source
          # Source proof only. Raw records, network tuples and worker reports stay private.
          path: |
            ${{ runner.temp }}/native-windows-network-source/inputs.json
            ${{ runner.temp }}/native-windows-network-source/network-source-validation.json
          if-no-files-found: warn
  windows-workspace-recovery:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify workspace-recovery evidence and privileged task failure handling
        run: |
          python tools/test_windows_service_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Task runner control-flow tests failed' }
          python tools/test_windows_workspace_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Workspace-recovery evidence tests failed' }
      - name: Build release agent and select exact workspace-recovery test executable
        shell: pwsh
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
          CARGO_PROFILE_RELEASE_DEBUG: 0
        run: |
          cargo build --locked --release -p athernex-endpoint
          if ($LASTEXITCODE -ne 0) { throw 'Workspace-recovery release agent build failed' }
          cargo test --locked --no-run --test windows_workspace -p athernex-endpoint --message-format=json > "$env:RUNNER_TEMP/workspace-recovery-build.jsonl"
          if ($LASTEXITCODE -ne 0) { throw 'Workspace-recovery test build failed' }
          $records = Get-Content -LiteralPath "$env:RUNNER_TEMP/workspace-recovery-build.jsonl" | ForEach-Object { $_ | ConvertFrom-Json }
          $matches = @($records | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -ceq 'windows_workspace' -and $_.profile.test -eq $true -and $_.executable })
          if ($matches.Count -ne 1) { throw 'Expected one workspace integration test executable' }
          ('WORKSPACE_RECOVERY_TESTS=' + $matches[0].executable) >> $env:GITHUB_ENV
      - name: Verify actual agent cleanup and partial-state recovery as LocalSystem
        timeout-minutes: 15
        shell: pwsh
        run: tools/verify_windows_workspace_ci.ps1 -AgentExecutable target/release/athernex-endpoint.exe -WorkspaceTests "$env:WORKSPACE_RECOVERY_TESTS" -OutputDirectory "$env:RUNNER_TEMP/native-windows-workspace-recovery" -DisposableHost
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-workspace-recovery
          # Exact public projection only. Worker state, paths, logon identities,
          # nonces, private reports and captured output stay on the VM.
          path: |
            ${{ runner.temp }}/native-windows-workspace-recovery/inputs.json
            ${{ runner.temp }}/native-windows-workspace-recovery/workspace-recovery-validation.json
          if-no-files-found: warn
  windows-authentication:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify privileged runner failure handling and suite-bound evidence
        run: |
          python tools/test_windows_service_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Task runner control-flow tests failed' }
          python tools/test_windows_isolation_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native suite evidence tests failed' }
      - name: Build and select exact native authentication test executable
        shell: pwsh
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          cargo test --locked --no-run --lib -p athernex-endpoint -p athernex-endpoint-native --message-format=json > "$env:RUNNER_TEMP/authentication-build.jsonl"
          if ($LASTEXITCODE -ne 0) { throw 'Native authentication build failed' }
          $records = Get-Content -LiteralPath "$env:RUNNER_TEMP/authentication-build.jsonl" | ForEach-Object { $_ | ConvertFrom-Json }
          foreach ($entry in @(@('athernex_endpoint','AUTHENTICATION_ENDPOINT_TESTS'), @('athernex_endpoint_native','AUTHENTICATION_NATIVE_TESTS'))) {
            $matches = @($records | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -ceq $entry[0] -and $_.profile.test -eq $true -and $_.executable })
            if ($matches.Count -ne 1) { throw ('Expected one test executable for ' + $entry[0]) }
            ($entry[1] + '=' + $matches[0].executable) >> $env:GITHUB_ENV
          }
      - name: Verify Security-log authentication delivery and policy gaps as LocalSystem
        timeout-minutes: 10
        shell: pwsh
        run: tools/verify_windows_isolation_ci.ps1 -Suite Authentication -EndpointTests "$env:AUTHENTICATION_ENDPOINT_TESTS" -NativeTests "$env:AUTHENTICATION_NATIVE_TESTS" -OutputDirectory "$env:RUNNER_TEMP/native-windows-authentication" -DisposableHost
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-authentication
          # Captured native output stays on the disposable worker. Upload only
          # suite-bound status and executable hashes, never event XML or accounts.
          path: |
            ${{ runner.temp }}/native-windows-authentication/inputs.json
            ${{ runner.temp }}/native-windows-authentication/authentication-validation.json
          if-no-files-found: warn
  windows-process-source:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify privileged runner failure handling and suite-bound evidence
        run: |
          python tools/test_windows_service_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Task runner control-flow tests failed' }
          python tools/test_windows_isolation_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native suite evidence tests failed' }
      - name: Build and select exact native process source proof executable
        shell: pwsh
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          cargo test --locked --no-run --lib -p athernex-endpoint -p athernex-endpoint-native --message-format=json > "$env:RUNNER_TEMP/process-source-build.jsonl"
          if ($LASTEXITCODE -ne 0) { throw 'Native process source proof build failed' }
          $records = Get-Content -LiteralPath "$env:RUNNER_TEMP/process-source-build.jsonl" | ForEach-Object { $_ | ConvertFrom-Json }
          foreach ($entry in @(@('athernex_endpoint','PROCESS_SOURCE_ENDPOINT_TESTS'), @('athernex_endpoint_native','PROCESS_SOURCE_NATIVE_TESTS'))) {
            $matches = @($records | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -ceq $entry[0] -and $_.profile.test -eq $true -and $_.executable })
            if ($matches.Count -ne 1) { throw ('Expected one test executable for ' + $entry[0]) }
            ($entry[1] + '=' + $matches[0].executable) >> $env:GITHUB_ENV
          }
      - name: Prove only the native ETW process source as LocalSystem
        timeout-minutes: 10
        shell: pwsh
        run: tools/verify_windows_isolation_ci.ps1 -Suite ProcessSource -EndpointTests "$env:PROCESS_SOURCE_ENDPOINT_TESTS" -NativeTests "$env:PROCESS_SOURCE_NATIVE_TESTS" -OutputDirectory "$env:RUNNER_TEMP/native-windows-process-source" -DisposableHost
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-process-source
          # Source proof only: no production collector or replay support claim.
          # Raw events, paths, logger names and worker reports stay private.
          path: |
            ${{ runner.temp }}/native-windows-process-source/inputs.json
            ${{ runner.temp }}/native-windows-process-source/process-source-validation.json
          if-no-files-found: warn
  windows-process-events:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify process-event evidence and privileged task failure handling
        run: |
          python tools/test_windows_service_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Task runner control-flow tests failed' }
          python tools/test_windows_process_events_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Process-event evidence tests failed' }
      - name: Build release agent and select exact process-event test executable
        shell: pwsh
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
          CARGO_PROFILE_RELEASE_DEBUG: 0
        run: |
          cargo build --locked --release -p athernex-endpoint
          if ($LASTEXITCODE -ne 0) { throw 'Process-event release agent build failed' }
          cargo test --locked --no-run --lib -p athernex-endpoint --message-format=json > "$env:RUNNER_TEMP/process-events-build.jsonl"
          if ($LASTEXITCODE -ne 0) { throw 'Process-event test build failed' }
          $records = Get-Content -LiteralPath "$env:RUNNER_TEMP/process-events-build.jsonl" | ForEach-Object { $_ | ConvertFrom-Json }
          $matches = @($records | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -ceq 'athernex_endpoint' -and $_.profile.test -eq $true -and $_.executable })
          if ($matches.Count -ne 1) { throw 'Expected one endpoint test executable' }
          ('PROCESS_EVENTS_ENDPOINT_TESTS=' + $matches[0].executable) >> $env:GITHUB_ENV
      - name: Verify process-event capture, agent crash recovery and original export as LocalSystem
        timeout-minutes: 15
        shell: pwsh
        run: tools/verify_windows_process_events_ci.ps1 -AgentExecutable target/release/athernex-endpoint.exe -EndpointTests "$env:PROCESS_EVENTS_ENDPOINT_TESTS" -OutputDirectory "$env:RUNNER_TEMP/native-windows-process-events" -DisposableHost
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-process-events
          # Exact public projection only. Commands, original events, addresses,
          # logger names, private reports and captured streams stay on the VM.
          path: |
            ${{ runner.temp }}/native-windows-process-events/inputs.json
            ${{ runner.temp }}/native-windows-process-events/process-events-validation.json
          if-no-files-found: warn
  windows-isolation:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify privileged runner failure and evidence handling with mocked commands
        run: |
          python tools/test_windows_service_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Task runner control-flow tests failed' }
          python tools/test_windows_isolation_ci.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Isolation evidence tests failed' }
          python tools/test_windows_scratch_formatter.py --powershell "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -v
          if ($LASTEXITCODE -ne 0) { throw 'Scratch formatter rejection tests failed' }
      - name: Build and select exact native isolation test executables
        shell: pwsh
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          cargo test --locked --no-run --lib -p athernex-endpoint -p athernex-endpoint-native --message-format=json > "$env:RUNNER_TEMP/isolation-build.jsonl"
          if ($LASTEXITCODE -ne 0) { throw 'Native isolation build failed' }
          $records = Get-Content -LiteralPath "$env:RUNNER_TEMP/isolation-build.jsonl" | ForEach-Object { $_ | ConvertFrom-Json }
          foreach ($entry in @(@('athernex_endpoint','ISOLATION_ENDPOINT_TESTS'), @('athernex_endpoint_native','ISOLATION_NATIVE_TESTS'))) {
            $matches = @($records | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -ceq $entry[0] -and $_.profile.test -eq $true -and $_.executable })
            if ($matches.Count -ne 1) { throw ('Expected one test executable for ' + $entry[0]) }
            ($entry[1] + '=' + $matches[0].executable) >> $env:GITHUB_ENV
          }
      - name: Verify scanner identity, WFP confinement, bounded scratch disk and crash recovery as LocalSystem
        timeout-minutes: 10
        shell: pwsh
        run: tools/verify_windows_isolation_ci.ps1 -EndpointTests "$env:ISOLATION_ENDPOINT_TESTS" -NativeTests "$env:ISOLATION_NATIVE_TESTS" -OutputDirectory "$env:RUNNER_TEMP/native-windows-isolation" -DisposableHost
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-isolation
          # Native logs and recovery state remain on the disposable worker.
          path: |
            ${{ runner.temp }}/native-windows-isolation/inputs.json
            ${{ runner.temp }}/native-windows-isolation/isolation-validation.json
          if-no-files-found: warn
  windows-filter-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified Microsoft driver kit files
        shell: pwsh
        run: python tools/prepare_windows_filter_kits.py --output "$env:RUNNER_TEMP/filter-kits" --package-cache "$env:RUNNER_TEMP/nuget-kits"
      - name: Build unsigned development minifilter
        shell: pwsh
        run: |
          $clang = (Get-Command clang.exe -ErrorAction Stop).Source
          $linker = Join-Path (Split-Path $clang) 'lld-link.exe'
          python tools/build_windows_filter.py --wdk "$env:RUNNER_TEMP/filter-kits/microsoft.windows.wdk.x64/c" --sdk "$env:RUNNER_TEMP/filter-kits/microsoft.windows.sdk.cpp/c" --clang "$clang" --linker "$linker" --output windows-filter-build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-filter-development-unsigned
          path: |
            windows-filter-build/athernex-filter.sys
            windows-filter-build/build.json
          if-no-files-found: error
  linux-prevention:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Match the compiler used for the local release and strict lint checks.
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native network evidence privacy with mocked execution
        run: python tools/test_network_events.py -v
      - name: Verify native authentication evidence privacy and failure handling
        run: python tools/test_auth_event_fixture.py -v
      - name: Build agent and control plane
        run: cargo build --locked --release -p athernex-endpoint -p athernex-siem -p athernex-endpoint-native
      - name: Prepare verified native AV engine
        run: python tools/prepare_native_protection_fixture.py --output "$RUNNER_TEMP/native-av"
      - name: Build isolated native test environment
        run: docker build -t athernex-native-protection-fixture:local infrastructure/endpoint/tests
      - name: Compile native event test executables
        run: cargo test --locked -p athernex-endpoint --lib --test continuous_telemetry --test authentication --no-run --message-format=json > "$RUNNER_TEMP/process-event-tests.jsonl"
      - name: Verify short-lived kernel events, durable delivery, agent crash and socket overflow
        run: python tools/verify_process_events.py --manifest "$RUNNER_TEMP/process-event-tests.jsonl" --agent target/release/athernex-endpoint --image athernex-native-protection-fixture:local
      - name: Build private network event test environment
        run: docker build -t athernex-native-network-fixture:local infrastructure/endpoint/network-tests
      - name: Verify native tracker flows, source availability, overflow and agent recovery
        run: python tools/verify_network_events.py --manifest "$RUNNER_TEMP/process-event-tests.jsonl" --agent target/release/athernex-endpoint
      - name: Compile optimized native load fixture
        run: cargo test --locked --release -p athernex-endpoint --lib --no-run --message-format=json > "$RUNNER_TEMP/network-load-tests.jsonl"
      - name: Measure sustained native tracker delivery through outage and restart
        timeout-minutes: 8
        run: python tools/verify_network_events.py --manifest "$RUNNER_TEMP/network-load-tests.jsonl" --agent target/release/athernex-endpoint --soak-seconds 120 --soak-rate 8 --report "$RUNNER_TEMP/network-load.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-network-load
          path: ${{ runner.temp }}/network-load.json
          if-no-files-found: error
      - name: Measure isolated endpoints against the real server through hard restarts
        timeout-minutes: 14
        run: python tools/verify_network_fleet.py --agent target/release/athernex-endpoint --server target/release/athernex-siem --seconds 180 --rate 4 --report "$RUNNER_TEMP/network-fleet.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-network-fleet
          path: ${{ runner.temp }}/network-fleet.json
          if-no-files-found: warn
      - name: Verify TLS rejection, certificate rotation and durable fleet recovery
        timeout-minutes: 16
        run: python tools/verify_network_fleet.py --agent target/release/athernex-endpoint --server target/release/athernex-siem --seconds 180 --rate 4 --tls --report "$RUNNER_TEMP/network-tls-fleet.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-network-tls-fleet
          path: ${{ runner.temp }}/network-tls-fleet.json
          if-no-files-found: warn
      - name: Build private authentication test environment
        run: docker build -t athernex-native-auth-fixture:local infrastructure/endpoint/auth-tests
      - name: Verify native SSH/PAM authentication, queue recovery, agent crash and detection
        run: python tools/verify_auth_events.py --manifest "$RUNNER_TEMP/process-event-tests.jsonl" --agent target/release/athernex-endpoint
      - name: Verify missing authentication producer identity remains visible
        run: python tools/verify_auth_events.py --manifest "$RUNNER_TEMP/process-event-tests.jsonl" --agent target/release/athernex-endpoint --missing-provenance
      - name: Build private Debian 13 authentication test environment
        run: docker build -f infrastructure/endpoint/auth-tests/debian13.Dockerfile -t athernex-native-auth-fixture:debian13 infrastructure/endpoint/auth-tests
      - name: Verify Debian 13 native SSH/PAM authentication, queue recovery, agent crash and detection
        run: python tools/verify_auth_events.py --image athernex-native-auth-fixture:debian13 --manifest "$RUNNER_TEMP/process-event-tests.jsonl" --agent target/release/athernex-endpoint
      - name: Verify Debian 13 missing authentication producer identity remains visible
        run: python tools/verify_auth_events.py --image athernex-native-auth-fixture:debian13 --manifest "$RUNNER_TEMP/process-event-tests.jsonl" --agent target/release/athernex-endpoint --missing-provenance
      - name: Verify real blocking, evidence delivery, failure reporting and recovery
        run: python tools/verify_native_protection.py --engine-prefix "$RUNNER_TEMP/native-av/engine/usr/local"
      - name: Verify signed engine staging, native activation and interrupted recovery
        run: python tools/verify_engine_update.py --engine-prefix "$RUNNER_TEMP/native-av/engine/usr/local"
      - name: Verify unattended engine activation and controller-crash recovery
        run: python tools/verify_engine_update.py --automatic --engine-prefix "$RUNNER_TEMP/native-av/engine/usr/local"
      - name: Verify reviewed fleet engine delivery, rollback and controller recovery
        run: python tools/verify_engine_update.py --fleet --server target/release/athernex-siem --engine-prefix "$RUNNER_TEMP/native-av/engine/usr/local"
      - name: Verify real engine canary promotion, server restart and failed-canary containment
        run: python tools/verify_engine_update.py --rollout --server target/release/athernex-siem --engine-prefix "$RUNNER_TEMP/native-av/engine/usr/local"
      - name: Verify native read barrier response acknowledgment and failure handling
        run: python3 -m unittest tools/test_native_read_barrier.py
      - name: Verify native adapter scan transport with real ClamAV
        run: python tools/verify_native_adapter.py --engine-prefix "$RUNNER_TEMP/native-av/engine/usr/local"
      - name: Validate Windows kernel wire layouts and scan decisions
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer infrastructure/endpoint/windows-filter/test_wire.c -o "$RUNNER_TEMP/windows-filter-wire"
          "$RUNNER_TEMP/windows-filter-wire"
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I infrastructure/endpoint/windows-filter/tests infrastructure/endpoint/windows-filter/test_scan.c -o "$RUNNER_TEMP/windows-filter-scan"
          "$RUNNER_TEMP/windows-filter-scan"
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I infrastructure/endpoint/windows-filter/tests infrastructure/endpoint/windows-filter/test_read.c -o "$RUNNER_TEMP/windows-filter-read"
          "$RUNNER_TEMP/windows-filter-read"
      - name: Verify Windows filter stream transport with real ClamAV
        run: python tools/verify_windows_filter_transport.py --engine-prefix "$RUNNER_TEMP/native-av/engine/usr/local"
      - name: Verify owned scanner and adapter lifetimes with real ClamAV
        run: python tools/verify_native_service.py --engine-prefix "$RUNNER_TEMP/native-av/engine/usr/local"
  endpoint:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            binary: target/release/athernex-endpoint
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            binary: target/release/athernex-endpoint
          - runner: windows-2022
            target: windows-x86_64
            binary: target/release/athernex-endpoint.exe
          - runner: macos-15
            target: macos-aarch64
            binary: target/release/athernex-endpoint
          - runner: macos-15-intel
            target: macos-x86_64
            binary: target/release/athernex-endpoint
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        id: endpoint_source
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test endpoint enforcement, receipt automation and protocol
        timeout-minutes: 20
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: cargo test --locked --no-fail-fast -p athernex-endpoint -p athernex-endpoint-protocol -p athernex-endpoint-native -p athernex-macos-network
      - name: Test native evidence sealing and verified backup recovery
        run: cargo test --locked -p athernex-siem --test storage_segments complete_backup_verifies_and_restores_history
      - name: Test retained Mac process, authentication and network observations and independent rollout gates
        run: cargo test --locked -p athernex-siem --test macos_process_events --test macos_authentication --test macos_network_events --test endpoint_rollouts --test engine_rollouts
      - name: Test required Windows driver package delivery
        run: cargo test --locked -p athernex-siem --test fleet windows_filter_package_delivery_requires_exact_bytes_and_marker -- --exact
      - name: Test exact journal identities and retained account claims
        run: 'cargo test --locked -p athernex-siem --lib collector::'
      - name: Test retained investigations and bounded evidence packets
        run: cargo test --locked -p athernex-siem --test investigative_memory --test investigator
      - name: Refuse disabled assertions in validation tools and isolated helpers
        run: python tools/test_verification_guards.py -v
      - name: Test artifact packaging with controlled signature results
        run: |
          python tools/test_package_endpoint.py
          python tools/test_package_windows_filter.py
          python tools/test_package_macos_network.py
          python -m unittest tools.test_build_macos_network
      - name: Test bounded engine bundle assembly
        run: python tools/test_package_engine.py
      - name: Test scratch formatter refusals with mocked storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/test_windows_scratch_formatter.py --powershell "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -v
      - name: Test macOS installer ordering with controlled system tools
        if: runner.os != 'Windows'
        run: python tools/test_macos_installer.py
      - name: Test private macOS verifier evidence and failure output
        if: runner.os != 'Windows'
        run: python tools/test_macos_native_verifier.py -v
      - name: Lint endpoint
        run: cargo clippy --locked -p athernex-endpoint -p athernex-endpoint-protocol -p athernex-endpoint-native -p athernex-macos-network --all-targets -- -D warnings
      - name: Build native endpoint
        id: native_endpoint_build
        run: cargo build --locked --release -p athernex-endpoint -p athernex-siem
      - name: Build development macOS authorization adapter
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release -p athernex-endpoint-native
          # Authentication adds macOS13 payload types, not newer client functions.
          # Preserve the existing process source's macOS12 import profile.
          native_imports=$(nm -u target/release/athernex-endpoint-native)
          case "$native_imports" in
            *_es_unmute_all_target_paths*|*_es_invert_muting*|*_es_muting_inverted*)
              echo 'Unexpected macOS13-only Endpoint Security function import.' >&2
              exit 1
              ;;
          esac
      # This SDK check does not depend on Rust binaries or packaging test outputs.
      - name: Compile unsigned macOS network components and run bounded source controls
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.endpoint_source.outcome == 'success' }}
        run: python3 tools/build_macos_network.py --output "$RUNNER_TEMP/macos-network" --development
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: native-authorization-development-${{ matrix.target }}
          path: target/release/athernex-endpoint-native
          if-no-files-found: error
      - name: Verify native enrollment, response and restart recovery
        run: python tools/verify_endpoint_fleet.py --bin-dir target/release
      - name: Verify signed updates and interrupted replacement recovery
        run: python tools/verify_endpoint_update.py
      - name: Verify signed controller replacement, exclusion and recovery
        run: python tools/verify_endpoint_update.py --component controller
      - name: Verify reviewed automatic installation and runtime rollback
        if: runner.os != 'macOS'
        run: python tools/verify_automatic_update.py
      - name: Verify launcher-owned controller updates and recovery
        if: runner.os != 'macOS'
        run: python tools/verify_controller_maintenance.py
      - name: Verify owned controller snapshot read retry
        if: runner.os != 'macOS'
        run: python -m unittest tools/test_controller_delivery.py
      - name: Verify reviewed controller delivery and durable recovery receipts
        if: runner.os != 'macOS'
        run: python tools/verify_controller_delivery.py
      - name: Verify fleet promotion, server restart and failed-canary containment
        if: runner.os != 'macOS'
        run: python tools/verify_endpoint_rollout.py
      - name: Verify controller fleet promotion and preservation of installed agents
        if: runner.os != 'macOS'
        run: python tools/verify_endpoint_rollout.py --component controller
      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        run: for script in infrastructure/endpoint/*.sh; do sh -n "$script"; done
      - name: Validate Windows installer syntax
        id: windows_installer_syntax
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.native_endpoint_build.outcome == 'success' }}
        shell: pwsh
        run: |
          foreach ($file in @('infrastructure/endpoint/install.ps1', 'core-engines/endpoint/src/installer/register.ps1', 'tools/verify_windows_service.ps1', 'tools/verify_windows_service_ci.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Verify Windows installer control flow with mocked commands
        id: windows_installer_tests
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.native_endpoint_build.outcome == 'success' }}
        run: python tools/test_windows_installer.py -v
      - name: Verify native service runner failure handling with mocked tasks
        id: windows_service_runner_tests
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.native_endpoint_build.outcome == 'success' }}
        run: python tools/test_windows_service_ci.py -v
      - name: Verify real SCM lifecycle as LocalSystem on the disposable hosted VM
        # Collect independent native service evidence after unrelated fixture
        # failures, while retaining the job failure and all service prerequisites.
        if: >-
          ${{ !cancelled() && runner.os == 'Windows' &&
              steps.native_endpoint_build.outcome == 'success' &&
              steps.windows_installer_syntax.outcome == 'success' &&
              steps.windows_installer_tests.outcome == 'success' &&
              steps.windows_service_runner_tests.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: tools/verify_windows_service_ci.ps1 -Agent target/release/athernex-endpoint.exe -OutputDirectory "$env:RUNNER_TEMP/native-windows-service" -DisposableHost
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: native-windows-service
          # Publish only the hash manifest and allowlisted check results.
          path: |
            ${{ runner.temp }}/native-windows-service/inputs.json
            ${{ runner.temp }}/native-windows-service/service-validation.json
          if-no-files-found: warn
      - name: Assemble development catalog
        run: python tools/package_endpoint.py --binary '${{ matrix.binary }}' --target '${{ matrix.target }}' --output endpoint-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-${{ matrix.target }}
          path: endpoint-artifacts/
          if-no-files-found: error
